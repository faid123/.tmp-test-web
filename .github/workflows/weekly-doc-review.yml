name: Weekly Documentation Review

# IMPORTANT: GitHub Actions only reads `schedule:` triggers from workflow files that
# exist on the repository's *default* branch (main), regardless of which branch this
# file lives on. Until this file (or an equivalent) is present on main, the cron below
# will not fire on its own — see Documentations/WEEKLY_DOC_REVIEW.md "Making the
# schedule actually fire" for what to do about that. The manual `workflow_dispatch`
# trigger works from this branch immediately, no matter where the default branch is.
on:
  schedule:
    # 01:00 UTC every Friday (09:00 SGT). Adjust if the team wants a different time.
    - cron: "0 1 * * 5"
  workflow_dispatch:

# Serialize runs so two reviews never race and commit conflicting artifacts.
concurrency:
  group: weekly-doc-review
  cancel-in-progress: false

permissions:
  contents: write

env:
  REVIEW_BRANCH: dev-deploy-documentation

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (deterministic, from lockfile)
        run: npm ci

      - name: Run weekly doc review
        run: node tools/weekly-doc-review.mjs

      - name: Archive coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Commit and push refreshed data + report
        run: |
          git add "Documentations/AutoTest Results"
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit — data was already current."
          else
            git -c user.email='ci@smartrpd.local' -c user.name='SmartRPD CI' \
              commit -m "Weekly doc review: refresh AutoTest results ($(date -u +%Y-%m-%d))"
            git push origin "HEAD:${REVIEW_BRANCH}"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Weekly Documentation Review" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This job only refreshes the automated data in \`Documentations/AutoTest Results/\`." >> "$GITHUB_STEP_SUMMARY"
          echo "The narrative \`.docx\` documents are **not** edited automatically — see the" >> "$GITHUB_STEP_SUMMARY"
          echo "generated \`weekly-review-*.md\` report for what changed and which docs to review." >> "$GITHUB_STEP_SUMMARY"
          echo "See Documentations/WEEKLY_DOC_REVIEW.md for the full process." >> "$GITHUB_STEP_SUMMARY"
