<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Annotate</title>
  <link rel="stylesheet" href="../../css/2DAnnotation_01.css" />
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" />
</head>
<body>
  <main class="annotation-shell">
    <aside class="panel preview-panel">
      <div class="preview-frame" id="imagePreviewArea">
        <button
          type="button"
          id="preview3dMaximizeBtn"
          class="preview-3d-max-btn"
          aria-label="Maximize 3D panel"
        >
          <!-- maximize icon -->
          <svg id="preview3dMaximizeIcon" viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 6V2h4M2 2l4 4M16 6V2h-4M16 2l-4 4M2 12v4h4M2 16l4-4M16 12v4h-4M16 16l-4-4"/>
          </svg>
          <!-- restore icon (shown when maximized) -->
          <svg id="preview3dRestoreIcon" viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M6 2v4H2M2 6l4-4M12 2v4h4M16 6l-4-4M6 16v-4H2M2 12l4 4M12 16v-4h4M16 12l-4 4"/>
          </svg>
        </button>
        <img id="previewImage" alt="Composed dental preview" />
        <p id="previewFallback" class="preview-fallback">
          No preview image found. Open from the 3D page after generating the composed image.
        </p>
      </div>
    </aside>

    <section class="workspace-panel">
      <section class="panel arch-panel">
        <div class="arch-topbar">
          <div id="caseLabel" class="case-label">Case: Unknown</div>
        </div>

        <div class="arch-controls">
          <div class="jaw-row">
            <img class="jaw-img" src="../../assets/Icon_UpperJaw_Occlusal.png" alt="Upper jaw icon" />
            <span class="jaw-row-name">Upper Arch (18 to 28)</span>
          </div>
          <div class="jaw-row">
            <img class="jaw-img" src="../../assets/Icon_LowerJaw_Occlusal.png" alt="Lower jaw icon" />
            <span class="jaw-row-name">Lower Arch (48 to 38)</span>
          </div>
        </div>

        <div class="jaw-combined-canvas">
          <svg id="upperArchSvg" class="arch-svg"></svg>
          <div class="jaw-lock-strip">
            <div class="jaw-lock-strip-cluster">
              <button
                type="button"
                id="undoWorkflowBtn"
                class="jaw-history-btn"
                aria-label="Undo"
                data-tooltip="Undo"
              >
                <img
                  class="jaw-history-icon"
                  src="../../assets/undo.png"
                  alt="Undo"
                  width="18"
                  height="18"
                />
              </button>
              <button
                type="button"
                id="jawLockToggleBtn"
                class="lock-btn jaw-lock-between-btn"
                aria-label="Switch to design mode"
                data-tooltip="Lock for design mode"
              >
                <img
                  class="lock-icon"
                  src="../../assets/unlock.png"
                  alt=""
                  width="20"
                  height="20"
                />
              </button>
              <button
                type="button"
                id="teethRangeMissingBtn"
                class="jaw-range-missing-btn"
                aria-pressed="false"
                data-tooltip="Remove multiple teeth"
              >
                <img
                  class="jaw-range-missing-icon"
                  src="../../assets/PresenceToothIconGreen.png"
                  alt="Teeth selected"
                  width="18"
                  height="18"
                />
              </button>
              <button
                type="button"
                id="removeComponentModeBtn"
                class="jaw-lock-eraser-btn"
                aria-label="Remove component mode"
                aria-pressed="false"
                data-tooltip="Remove components: click a tooth, then pick what to remove"
                disabled
              >
                <img
                  class="jaw-lock-eraser-icon"
                  src="../../assets/eraser.svg"
                  alt=""
                  width="22"
                  height="22"
                />
              </button>
              <button
                type="button"
                id="redoWorkflowBtn"
                class="jaw-history-btn jaw-history-btn-redo"
                aria-label="Redo"
                data-tooltip="Redo"
              >
                <img
                  class="jaw-history-icon"
                  src="../../assets/undo.png"
                  alt="Redo"
                  width="18"
                  height="18"
                />
              </button>
            </div>
          </div>
          <svg id="lowerArchSvg" class="arch-svg"></svg>
        </div>

        <div class="action-list center-actions">
          <button id="clearTopBtn" type="button" class="action-btn">Clear upper teeth</button>
          <button id="clearBottomBtn" type="button" class="action-btn">Clear lower teeth</button>
          <button id="drawFromScratchBtn" class="action-btn">Draw from Scratch</button>
          <button id="saveAnnotationBtn" class="action-btn primary">Save</button>
          <button id="saveJpegBtn" type="button" class="action-btn">Save as JPEG</button>
          <button id="openNoticeboardBtn" type="button" class="action-btn">Noticeboard</button>
        </div>

        <p id="saveMessage" class="save-message" role="status"></p>
      </section>

      <aside class="panel tools-panel">
        <section id="selectTeethPanel" class="select-teeth-panel">
          <div class="panel-mini-title">Select Teeth</div>
          <div class="status-picker">
            <button class="status-btn is-active" data-status="presence">
              <img class="status-icon" src="../../assets/PresenceToothIconGreen.png" alt="Presence" />
            </button>
            <button class="status-btn" data-status="abutment">
              <img class="status-icon" src="../../assets/AbutmentToothIconBlue.png" alt="Abutment" />
            </button>
            <button class="status-btn" data-status="compromised">
              <img class="status-icon" src="../../assets/CompromisedToothIconYellow.png" alt="Compromised" />
            </button>
          </div>
        </section>

        <section id="editModePanel" class="edit-mode-panel is-hidden">
          <h3 class="edit-mode-title">Components</h3>
          <div class="catalog-wrap">
            <div id="componentTabs" class="component-tabs"></div>
            <div class="component-canvas">
              <div id="componentItems" class="component-items"></div>
            </div>
          </div>
          <div class="selected-components" id="selectedComponents"></div>
        </section>
      </aside>
    </section>
  </main>

  <div id="removeComponentDialog" class="remove-component-dialog is-hidden" aria-hidden="true">
    <div class="remove-component-dialog-backdrop" aria-hidden="true"></div>
    <div
      class="remove-component-dialog-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="removeComponentDialogTitle"
    >
      <h2 id="removeComponentDialogTitle" class="remove-component-dialog-title">Remove component</h2>
      <p id="removeComponentDialogHint" class="remove-component-dialog-hint is-hidden"></p>
      <div id="removeComponentList" class="remove-component-list"></div>
      <div class="remove-component-dialog-footer">
        <button type="button" id="removeComponentDialogCancel" class="remove-component-cancel-btn">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <div id="anteriorRestSurfaceDialog" class="anterior-rest-dialog is-hidden" aria-hidden="true">
    <div class="anterior-rest-dialog-backdrop" aria-hidden="true"></div>
    <div
      class="anterior-rest-dialog-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="anteriorRestSurfaceTitle"
    >
      <h2 id="anteriorRestSurfaceTitle" class="anterior-rest-dialog-title">Set Cingulum Rest</h2>
      <div class="anterior-rest-dialog-actions">
        <button type="button" class="anterior-rest-surface-btn" data-rest-surface="lingual_mesial">Mesial</button>
        <button type="button" class="anterior-rest-surface-btn" data-rest-surface="lingual_distal">Distal</button>
        <button type="button" class="anterior-rest-surface-btn" data-rest-surface="lingual">Full</button>
      </div>
    </div>
  </div>

  <div id="noticeboardModal" class="noticeboard-modal is-hidden" aria-hidden="true">
    <div class="noticeboard-backdrop" aria-hidden="true"></div>
    <div
      class="noticeboard-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="noticeboardTitle"
    >
      <header class="noticeboard-topbar">
        <div class="noticeboard-topbar-left">
          <h2 id="noticeboardTitle" class="noticeboard-title">NOTICEBOARD</h2>
          <button type="button" id="noticeboardGenerateReportBtn" class="noticeboard-generate-btn">
            GENERATE REPORT
          </button>
        </div>
        <button
          type="button"
          id="noticeboardCloseBtn"
          class="noticeboard-close-btn"
          aria-label="Close noticeboard"
        >
          ×
        </button>
      </header>

      <div class="noticeboard-body">
        <section class="noticeboard-column noticeboard-column-2d">
          <div class="noticeboard-column-titlerow">
            <img
              class="noticeboard-column-icon"
              src="../../assets/Icon_UpperJaw_Occlusal.png"
              alt=""
            />
            <h3 class="noticeboard-column-title">2D Setup &amp; Design</h3>
          </div>

          <div class="noticeboard-add-row">
            <button type="button" id="addInstructionBtn" class="noticeboard-add-card">
              <div class="noticeboard-add-card-preview">
                <img id="addInstructionPreview" alt="" />
                <span class="noticeboard-add-card-placeholder">No preview</span>
              </div>
              <span class="noticeboard-add-card-label">+ ADD NEW INSTRUCTION</span>
            </button>
          </div>

          <div id="instructionGrid" class="noticeboard-grid" role="list"></div>
        </section>

        <section class="noticeboard-column noticeboard-column-3d">
          <div class="noticeboard-tabs" role="tablist">
            <button
              type="button"
              class="noticeboard-tab is-active"
              data-noticeboard-tab="3d"
              role="tab"
            >
              3D DESIGN
            </button>
            <button
              type="button"
              class="noticeboard-tab"
              data-noticeboard-tab="other"
              role="tab"
            >
              [OTHER DEVICES]
            </button>
          </div>

          <div class="noticeboard-column-titlerow">
            <img class="noticeboard-column-icon" src="../../assets/Model.png" alt="" />
            <h3 class="noticeboard-column-title">3D Design</h3>
          </div>

          <div class="noticeboard-add-row">
            <button type="button" id="addViewcaptureBtn" class="noticeboard-add-card">
              <div class="noticeboard-add-card-preview">
                <span class="noticeboard-add-card-placeholder">No preview</span>
              </div>
              <span class="noticeboard-add-card-label">+ ADD NEW VIEWCAPTURE</span>
            </button>
          </div>

          <div id="viewcaptureGrid" class="noticeboard-grid" role="list"></div>
        </section>
      </div>

      <footer class="noticeboard-footer">
        <button type="button" id="downloadJawProfileBtn" class="noticeboard-footer-btn">
          DOWNLOAD JAW PROFILE
        </button>
        <button
          type="button"
          id="drawFromScratchModalBtn"
          class="noticeboard-footer-btn noticeboard-footer-btn-primary"
        >
          DRAW FROM SCRATCH
        </button>
      </footer>
    </div>
  </div>

  <div id="instructionEditorModal" class="instruction-editor-modal is-hidden" aria-hidden="true">
    <div class="instruction-editor-backdrop" aria-hidden="true"></div>
    <div
      class="instruction-editor-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Instruction drawing editor"
    >
      <div class="instruction-editor-canvas-wrap">
        <canvas id="instructionEditorCanvas" class="instruction-editor-canvas"></canvas>
      </div>

      <aside class="instruction-editor-tools">
        <div class="instruction-editor-tools-top">
          <button type="button" id="instructionEditorCancelBtn" class="instruction-editor-btn">
            CANCEL
          </button>
          <button
            type="button"
            id="instructionEditorSaveBtn"
            class="instruction-editor-btn instruction-editor-btn-primary"
          >
            SAVE AND CLOSE
          </button>
        </div>

        <section class="instruction-editor-section">
          <h3 class="instruction-editor-section-title">Currently Drawing</h3>
          <div class="instruction-editor-tool-row">
            <button
              type="button"
              class="instruction-editor-icon-btn"
              data-instruction-tool="line"
              aria-label="Line: click two points"
              data-tooltip="Line: click two points"
            >
              <svg viewBox="0 0 24 24" width="22" height="22">
                <line
                  x1="4"
                  y1="20"
                  x2="20"
                  y2="4"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
                <circle cx="4" cy="20" r="2.2" fill="currentColor" />
                <circle cx="20" cy="4" r="2.2" fill="currentColor" />
              </svg>
            </button>
            <button
              type="button"
              class="instruction-editor-icon-btn"
              data-instruction-tool="text"
              aria-label="Text box"
              data-tooltip="Text box"
            >
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path
                  d="M4 5h14a2 2 0 012 2v8a2 2 0 01-2 2H10l-4 4v-4H4a2 2 0 01-2-2V7a2 2 0 012-2z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <circle cx="8" cy="11" r="1" fill="currentColor" />
                <circle cx="12" cy="11" r="1" fill="currentColor" />
                <circle cx="16" cy="11" r="1" fill="currentColor" />
              </svg>
            </button>
          </div>
        </section>

        <section class="instruction-editor-section">
          <h3 class="instruction-editor-section-title">Draw Settings</h3>

          <button type="button" id="clearDrawingsBtn" class="instruction-editor-btn">
            CLEAR DRAWINGS
          </button>

          <div class="instruction-editor-tool-row">
            <button
              type="button"
              id="undoDrawBtn"
              class="instruction-editor-icon-btn"
              aria-label="Undo"
              data-tooltip="Undo"
            >
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M9 14l-4-4 4-4M5 10h9a5 5 0 010 10h-3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              type="button"
              id="redoDrawBtn"
              class="instruction-editor-icon-btn"
              aria-label="Redo"
              data-tooltip="Redo"
            >
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M15 14l4-4-4-4M19 10h-9a5 5 0 000 10h3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <div class="instruction-editor-tool-row">
            <button
              type="button"
              class="instruction-editor-icon-btn"
              data-instruction-tool="brush"
              aria-label="Brush"
              data-tooltip="Brush"
            >
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M14 4l6 6-9 9-6-1-1-6z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              type="button"
              class="instruction-editor-icon-btn is-active"
              data-instruction-tool="pen"
              aria-label="Pen"
              data-tooltip="Pen"
            >
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M3 21l3.5-1L20 7.5 16.5 4 3 17.5z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              type="button"
              class="instruction-editor-icon-btn"
              data-instruction-tool="eraser"
              aria-label="Eraser"
              data-tooltip="Eraser"
            >
              <img
                src="../../assets/eraser.svg"
                alt=""
                class="instruction-editor-icon-img"
                width="22"
                height="22"
              />
            </button>
          </div>

          <div class="instruction-editor-size-row">
            <label for="strokeSizeInput">Size</label>
            <input
              type="range"
              id="strokeSizeInput"
              min="1"
              max="24"
              step="0.5"
              value="6"
            />
            <span id="strokeSizeValue">6.0</span>
          </div>
        </section>

        <section class="instruction-editor-section">
          <h3 class="instruction-editor-section-title">Colours</h3>
          <div class="instruction-editor-color-grid">
            <button
              type="button"
              class="instruction-editor-color-swatch"
              data-instruction-color="#3CB043"
              style="background:#3CB043"
              aria-label="Green"
            ></button>
            <button
              type="button"
              class="instruction-editor-color-swatch is-active"
              data-instruction-color="#7B3FF2"
              style="background:#7B3FF2"
              aria-label="Purple"
            ></button>
            <button
              type="button"
              class="instruction-editor-color-swatch"
              data-instruction-color="#E91E63"
              style="background:#E91E63"
              aria-label="Pink"
            ></button>
            <button
              type="button"
              class="instruction-editor-color-swatch"
              data-instruction-color="#3DD8E8"
              style="background:#3DD8E8"
              aria-label="Cyan"
            ></button>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="../js/2D/2DAnnotation.js"></script>
</body>
</html>
