<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div class="login-page">
      <div class="dot-grid dot-grid-left" aria-hidden="true"></div>
      <div class="dot-grid dot-grid-right" aria-hidden="true"></div>
      <div class="blob blob-left" aria-hidden="true"></div>
      <div class="blob blob-right" aria-hidden="true"></div>

      <div class="login-box">
        <div class="brand-badge" aria-hidden="true">
          <img src="./assets/profile.png" alt="" />
        </div>

        <div class="login-content">
          <h1>Welcome Back!</h1>

          <label class="field">
            <span class="icon" aria-hidden="true"><img src="./assets/user.png" alt="" /></span>
            <input type="text" id="username" placeholder="Enter your username" />
          </label>

          <label class="field">
            <span class="icon" aria-hidden="true"><img src="./assets/padlock.png" alt="" /></span>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
            />
            <button
              type="button"
              class="toggle-eye"
              id="togglePassword"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="eye-icon eye-show" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-icon eye-hide" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.79 19.79 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a19.86 19.86 0 0 1-3.17 4.19"/>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </label>

          <button id="btn" onclick="login()">
            <span>Log In</span>
            <span class="arrow" aria-hidden="true">&#8594;</span>
          </button>

          <p id="error-message"></p>

          <p class="forgot-text">Forgot your password?</p>
        </div>
      </div>
    </div>
    <script src="./src/js/login.js"></script>
  </body>
</html>
